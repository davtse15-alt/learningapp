name: Deploy Sound Steps to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

# Queue Pages deploys so rapid commits cannot collide at the deployment API.
concurrency:
  group: github-pages
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
